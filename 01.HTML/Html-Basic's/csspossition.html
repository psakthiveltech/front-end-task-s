<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .bigbox{
      height: 400px;
      width: 600px;
      border: 12px solid ;
      margin: auto;
      position: relative;
    }
    .inner1{
      background-color: red;
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
      right: 0px;
    }
    .inner2{
      background-color: rgb(18, 165, 250);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
      
    }
    
     .inner3{
      background-color: rgb(18, 250, 88);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
      bottom: 0;
      
    }
     .inner4{
      background-color: rgb(0, 0, 0);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
      bottom: 0px;
      right: 0;
    }
     
         .inner5{
      background-color: rgb(183, 233, 34);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
      left: 60%;

    }
         .inner6{
      background-color: rgb(173, 57, 57);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
      right: 60%;
 
 
    }     .inner7{
      background-color: rgb(0, 0, 0);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
 
    }     .inner8{
      background-color: rgb(0, 0, 0);
      height: 100px;
      width: 100px;
      border: 1.5px solid;
      position: absolute;
    
    }
  </style>
</head>
<body>
  <div class="bigbox">
    <div class="inner1"></div>
    <div class="inner2"></div>
    <div class="inner3"></div>
    <div class="inner4"></div>
    <div class="inner5"></div>
    <div class="inner6"></div>
    <div class="inner7"></div>
    <div class="inner8"></div>
  </div>
</body>
</html>
