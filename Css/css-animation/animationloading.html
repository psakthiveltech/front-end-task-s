<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .bex{
      height: 100px;
      width: 100px;
      color: rgb(22, 134, 185);
      border: 1px solid ;
      background-color: #1282b1;
      animation: rotate 1s ease-out infinite;
      
    }
  
    @keyframes rotate  {
      0%{
        transform: rotateX(360deg);
      }
     
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bex">
    </div>
  </div>
</body>
</html>
