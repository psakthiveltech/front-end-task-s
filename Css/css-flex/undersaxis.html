<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .bbox{
      height: 600px;
      width: 100%;
      background-color: rgb(0, 247, 255);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .sbox{
      height: 350px;
      width: 300px;
      background-color: rgb(16, 16, 16);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      
    }
    .item{
      height: 40px;
      width: 250px;
      background-color: rgb(255, 234, 0);
      margin: 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="bbox">
    <div class="sbox">
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </div>
</body>
</html>
