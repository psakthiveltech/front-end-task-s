<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .bb{
      display: flex;
      justify-content: center;
      border: 2px solid rebeccapurple;

    }
    .item1{
      height: 100px;
      width: 100px;
      background-color: aqua;
      border: 2px solid rebeccapurple;
      flex-grow: 1;
    }
        .item2{
      height: 100px;
      width: 100px;
      background-color: aqua;
      border: 2px solid rebeccapurple;
      flex-basis: 100PX;
    }    .item3{
      height: 100px;
      width: 100px;
      background-color: aqua;
      border: 2px solid rebeccapurple;
      flex-shrink: 1;

    }    .item4{
      height: 100px;
      width: 100px;
      background-color: aqua;
      border: 2px solid rebeccapurple;
      flex-shrink: 1;

    }
  </style>
</head>
<body>
  <div class="bb">
    <div class="item1"></div>
    <div class="item2"></div>
    <div class="item3"></div>
  </div>
</body>
</html>
