<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  @keyframes h1{
    from{
       transform: translateX(-300px);
    }
    to{
      transform: translateX(700px);

    }
  }
  h1{
    animation: h1 2s ease-in-out 0s infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 700px;
    width: 100%;
  }
</style>
<body>
  <h1>🤣</h1>
</body>
</html>
