<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .cal{
    background-color: yellowgreen;
    height: 100px;
  }
  .cont{
    display: grid;
    grid-template-columns: 100px 100px 100px 1fr;
    column-gap: 10px ;
    row-gap: 10px;
  }
  .cal0{
    background-color: bisque;
  }
</style>
<body>
  <div class="cont">
    <div class="cal"></div>
    <div class="cal"></div>
    <div class="cal"></div>
    <div class="cal0"></div>
    <div class="cal"></div>
    <div class="cal"></div>
    <div class="cal"></div>
    <div class="cal0"></div>
  </div>
</body>
</html>
