<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="container">
  <h1>THIS IS ELEMENT</h1>
  </div>
  <div class="box"></div>
</body>
<style>
  .box{
    height: 400px;
    width: 200px;
    background-color: aqua;
    border-radius: 40px 0px 0px 0px;
  }
  *{

    margin: 0px,0px,0px,200px;

  }
  h1{
    display: inline;
    position: relative;
    padding: 10px;
  }
  .container{}

h1::after{
content: '';
background-color: purple;
position: absolute;
bottom: 0px;
left: 0px;
height: 4px;
width: 0%;
background: linear-gradient(to right,rgb(0, 166, 255),rgb(217, 0, 255));
border-radius: 10px;
transition: all 1s ease-in-out 0s;
}
h1:hover::after{
width: 100%;
transform: translateX(250px);
}

</style>
</html>
