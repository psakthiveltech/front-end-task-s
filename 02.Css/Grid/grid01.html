<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      display: grid;
      grid-template-columns: 80px 1fr;
      height: 100px;
      width: 600px;
      box-shadow: 10px 10px 10px 0.17px rgba(0,0,0,0.17);
      column-gap: 10px;
      margin-bottom: 20px;
    }
    .text-title{
      height: 20px;
      vertical-align: top;
      
h1{
  margin: 0;
}
    }
    .heads{
      display: grid;
      grid-template-columns: 300px 200px;
    }
    img{
      border-radius: 50px;
    }
    button {
      background-color: rgb(0, 162, 255);
      border-style: none;
      padding: 10px;
      color: white;
      border-radius: 10px;
      margin-top: 20px;

    }
  

   </style>
</head>
<body>
 <div class="box">
  <div class="icon">
    <img src="./Asserts/channel-2.jpeg" alt="">

  </div>
  <div class="box-content">
    <div class="heads">
    <div class="box-head-s">
    <div class="text-title"><h1>Oliver</h1></div>
    <div class="text-des">the cat</div>
    <div class="text-des">POPuLaR</div>
    </div>
    <div class="button-follow">
      <button>Follow</button>
    </div>
    </div>
  </div>
 </div>
</body>

 </div>
</html>
