<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h id="show"></h>
</body>
<script>
  const fullName = "laptop"
  str = fullName.toUpperCase()
  str2 = fullName.toLowerCase()
  str3 = fullName.length
  substrings = fullName.substring("3")
  substringes = fullName.substr(2)
  index  = fullName.indexOf("p")
  indeX  = fullName.lastIndexOf("p")
  indEX  = fullName.repeat(10)


  document.getElementById("show").innerHTML = str + "<br>" + str2 + "<br>" + str3 +"<br>" + substrings +"<br>" + substringes+"<br>" + index +"<br>" + indeX +"<br>" +  indEX
</script>
</html>
