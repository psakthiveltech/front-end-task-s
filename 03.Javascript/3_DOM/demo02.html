<input type="text" id="name">
<script>
document.getElementById("name").addEventListener("keydown", function() {
  alert("You pressed a key!");
});
</script>
<button id="btn">Click Me</button>
<script>
document.getElementById("btn").addEventListener("click", function() {
  alert("You clicked the button!");
});
</script>

<form id="myForm">
  <input id="user" type="text" placeholder="Your name">
  <button>Submit</button>
</form>
<script>
document.getElementById("myForm").addEventListener("submit", function(event) {
  event.preventDefault(); // stop reloading
  alert("Form submitted!");
});
</script>
<script>window.addEventListener("scroll", function() {
  console.log("You scrolled the page!");
});
document.addEventListener("click", function(e) {
  console.log("You clicked on:", e.target.tagName);
});


</script>
